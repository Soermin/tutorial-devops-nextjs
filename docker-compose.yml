services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorial-nextjs-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/tutorialdb
      NEXT_PUBLIC_APP_NAME: Tutorial DevOps
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tutorial-network

  postgres:
    image: postgres:16-alpine
    container_name: tutorial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutorialdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d tutorialdb']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tutorial-network

  nginx:
    image: nginx:alpine
    container_name: tutorial-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tutorial-network

volumes:
  postgres-data:

networks:
  tutorial-network:
    driver: bridge

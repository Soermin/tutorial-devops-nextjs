services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorial-nextjs-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/tutorialdb
      NEXT_PUBLIC_APP_NAME: Tutorial DevOps
    depends_on:
      - postgres
    networks:
      - tutorial-network

  postgres:
    image: postgres:16-alpine
    container_name: tutorial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutorialdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tutorial-network

  nginx:
    image: nginx:alpine
    container_name: tutorial-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tutorial-network

volumes:
  postgres-data:

networks:
  tutorial-network:
    driver: bridge
